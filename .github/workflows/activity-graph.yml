name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Ashutosh00710/github-readme-activity-graph@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: matheusmerigo
          BG_COLOR: "0d1117"
          COLOR: "004E89"
          LINE: "00f2ff"
          POINT: "ffffff"
          AREA: true
          HIDE_BORDER: true
          OUTPUT_DIR: "dist"
          FILE_NAME: "activity-graph.svg"
      - name: Commit Graph
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
